name: partflow

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partflow}
      POSTGRES_USER: ${POSTGRES_USER:-partflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partflow-local-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # V1.5 uses a new schema. Do not attach the legacy PartFlow volume
      # (which contains migrations 0001..0019 and incompatible bigint IDs).
      - postgres_data_v15:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment: &app-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],web}
      # The browser uses the frontend origin while nginx proxies requests to
      # this container. Both local hostnames must be trusted for Django's
      # Origin/CSRF check on the login POST.
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173}
      POSTGRES_DB: ${POSTGRES_DB:-partflow}
      POSTGRES_USER: ${POSTGRES_USER:-partflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partflow-local-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      # V1.4 uses LDAP on the internal network (389).  Keep credentials in
      # compose for the local lab only; production should switch to .env/secrets.
      LDAP_ENABLED: ${LDAP_ENABLED:-0}
      LDAP_HOST: ${LDAP_HOST:-host.docker.internal}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_UID: ${LDAP_UID:-sAMAccountName}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_PASS: ${LDAP_PASS:-}
      LDAP_BASE: ${LDAP_BASE:-}
      # External MinIO; all local buckets carry the -lab suffix.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_S3_CONTROL_ENDPOINT: ${MINIO_S3_CONTROL_ENDPOINT:-}
      MINIO_S3_PUBLIC_ENDPOINT: ${MINIO_S3_PUBLIC_ENDPOINT:-}
      MINIO_CONSOLE_URL: ${MINIO_CONSOLE_URL:-}
      MINIO_CONSOLE_ENDPOINT: ${MINIO_CONSOLE_ENDPOINT:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE:-plm-quarantine}
      MINIO_BUCKET_DRAFT: ${MINIO_BUCKET_DRAFT:-plm-draft}
      MINIO_BUCKET_RELEASE: ${MINIO_BUCKET_RELEASE:-plm-release}
      MINIO_BUCKET_EXPORT: ${MINIO_BUCKET_EXPORT:-plm-export}
      PLM_MAX_UPLOAD_BYTES: ${PLM_MAX_UPLOAD_BYTES:-5368709120}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-1}
      AUTO_COLLECTSTATIC: ${AUTO_COLLECTSTATIC:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  # Run once when provisioning the local lab buckets.  It talks to the
  # separately deployed MinIO at MINIO_ENDPOINT and never stores objects locally.
  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_S3_CONTROL_ENDPOINT: ${MINIO_S3_CONTROL_ENDPOINT:-}
      MINIO_S3_PUBLIC_ENDPOINT: ${MINIO_S3_PUBLIC_ENDPOINT:-}
      MINIO_CONSOLE_URL: ${MINIO_CONSOLE_URL:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE:-plm-quarantine}
      MINIO_BUCKET_DRAFT: ${MINIO_BUCKET_DRAFT:-plm-draft}
      MINIO_BUCKET_RELEASE: ${MINIO_BUCKET_RELEASE:-plm-release}
      MINIO_BUCKET_EXPORT: ${MINIO_BUCKET_EXPORT:-plm-export}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set lab \"$${MINIO_ENDPOINT}\" \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      for bucket in \"$${MINIO_BUCKET_QUARANTINE}\" \"$${MINIO_BUCKET_DRAFT}\" \"$${MINIO_BUCKET_RELEASE}\" \"$${MINIO_BUCKET_EXPORT}\"; do
        case \"$$bucket\" in *-lab) ;; *) echo \"refusing non-lab bucket: $$bucket\" >&2; exit 2;; esac;
        mc mb --ignore-existing \"lab/$$bucket\";
      done"
    profiles: [storage-init]
    restart: "no"

volumes:
  postgres_data_v15:
    name: ${POSTGRES_VOLUME_NAME:-partflow_v15_postgres_data}

networks:
  default:
    # Keep backend and frontend on one HTTP-only Docker network.  Override
    # PARTFLOW_NETWORK when running more than one checkout on the same host so
    # service DNS names (especially `db`) cannot collide.
    name: ${PARTFLOW_NETWORK:-partflow_net}

