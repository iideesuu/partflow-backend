# MinIO S3 data plane for PartFlow PLM
# Install as /etc/nginx/conf.d/s3.chipedgetech.com.conf on 10.1.58.13.
# The certificate is provided by the shared nginx.ssl.conf include.
upstream partflow_minio_s3 {
    server 10.1.58.6:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name s3.chipedgetech.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name s3.chipedgetech.com;

    include /etc/nginx/nginx.ssl.conf;

    # The browser sends one 64 MiB multipart part at a time. Django never
    # receives the object body; this limit only protects the S3 proxy path.
    client_max_body_size 80m;

    location / {
        proxy_pass http://partflow_minio_s3;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";

        # Preserve the SigV4 canonical request exactly. Do not add a path
        # prefix, rewrite the URI, or change the Host used for signing.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        add_header Vary Origin always;
    }
}
